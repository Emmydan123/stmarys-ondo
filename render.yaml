services:
  - type: web
    name: stmarys-ondo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/events
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: STMARY_DATA_DIR
        value: /tmp/stmarys-data
      - key: STMARY_UPLOAD_DIR
        value: /tmp/stmarys-uploads